spring:
  application:
    name: config-server
  cloud:
      config:
        server:
            git:
              uri: https://github.com/JuanGuevara90/microservices-config-data.git
              username: ${GITHUB_USER}
              password: ${GITHUB_TOKEN}
              clone-on-start: true
              default-label: main
server:
  port: 8888

